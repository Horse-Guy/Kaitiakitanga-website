<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="stylesheet.css">
    <title>Ocean Guardian |Sign Up|</title>
</head>
<body>
    <div class="navbar">
        <div class="logo"><a href="index.html"><img src="images/real.png"width="150" alt="place_holder"></a></div>
        <div class="pages">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
        <div class="donate">
            <a href="donate.html">Donate</a>
        </div>
        <div class="sign_log">
            <a href="sign_up.html">Sign Up</a>
            <a href="login.html">Login</a>
        </div>
    </div>
    <div>
        <form >
            <div>
                <label for="fname">First Name:</label>
                <input type="fname" id="fname">
            </div>
            <div>
                <label for="lname">Last Name:</label>
                <input type="lname" id="lname">
            </div>
            <div>
                <label for="email">Email address:</label>
                <input type="email" id="email">
            </div>
            <div>
                <label for="password">Password:</label>
                <input type="password" id="password">
            </div>
            <div>
                <label for="cpassword">Confirm Password:</label>
                <input type="cpassword" id="cpassword">
            </div>
            <div>
                <label for="phone">Phone Number:</label>
                <input type="phone" id="phone">
            </div>
            <div>
                <label for="city">City:</label>
                <input type="city" id="city">
            </div>
            <div>
                <input type="checkbox"> I agree to the terms
            </div>
            <div>
                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
            </div>
        </form>

    </div>
    <div class="footbar">
        <h2>Ocean Guardian</h2>
        <p>Protecting our oceans, preserving our future.</p>

        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <p>©2026 Ocean Guardian All rights reserved.</p>
    </div>
</body>
</html>
